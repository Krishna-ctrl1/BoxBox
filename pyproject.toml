[project]
name = "boxbox"
version = "0.1.0"
description = "F1 pit strategy priced like an American option: lap-time model, race simulator and optimal pit engine."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Krishna Gupta" }]
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
